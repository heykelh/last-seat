:root{--bg:#0a0b1e;--panel:#13142e;--panel2:#1c1d40;--line:#34366e;--ink:#f4f1ff;--mut:#9a9cc4;--mt:#00b388;--cy:#1b9fe0;--pk:#c8107e;--ye:#ffb612;--gr:#82be00;--pu:#8f86e6;--or:#e05206;--rd:#f0233a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.85}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);z-index:60}
#app{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:10px 12px 50px}
.px,h1,h2,h3,.btn,.tag{font-family:'Press Start 2P',monospace}
h2{font-size:14px;color:var(--ye);line-height:1.6;margin:0 0 10px}
h3{font-size:11px;line-height:1.6;margin:0 0 6px;color:var(--cy)}
b{color:#fff}
.cy{color:var(--cy)}.pk{color:var(--pk)}.ye{color:var(--ye)}.gr{color:var(--gr)}.pu{color:var(--pu)}.or{color:var(--or)}.rd{color:var(--rd)}.mut{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-size:13px;cursor:pointer;letter-spacing:1px}
.brand i{font-style:normal;color:var(--pk)}
.topbtns{display:flex;gap:6px}
.btn{font-size:10px;padding:12px 14px;border:3px solid #000;background:var(--cy);color:#0a0b1e;box-shadow:4px 4px 0 #000,inset -3px -3px 0 rgba(0,0,0,.25);cursor:pointer;line-height:1.5}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.sm{font-size:12px;padding:8px 10px}
.btn.big{font-size:13px;padding:16px 18px}
.btn.pk{background:var(--pk);color:#fff}.btn.ye{background:var(--ye)}.btn.gr{background:var(--gr)}.btn.or{background:var(--or);color:#fff}.btn.pu{background:var(--pu)}.btn.rd{background:var(--rd);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:#000}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.sel{outline:3px solid #fff;outline-offset:2px}
.panel{background:rgba(19,20,46,.95);border:3px solid var(--line);box-shadow:6px 6px 0 #000;padding:14px;margin:14px 0;position:relative}
.n-cy{border-color:var(--cy)}.n-pk{border-color:var(--pk)}.n-ye{border-color:var(--ye)}.n-gr{border-color:var(--gr)}.n-pu{border-color:var(--pu)}.n-or{border-color:var(--or)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.center{text-align:center}.center .row{justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:780px){.grid2,.grid3{grid-template-columns:1fr}}
.tag{display:inline-block;padding:4px 7px;border:2px solid #000;font-size:8px;color:#fff;text-shadow:1px 1px 0 #000;vertical-align:middle}
.hidden{display:none!important}
.logo{font-family:'Press Start 2P';font-size:clamp(36px,9vw,82px);text-align:center;margin:22px 0 4px;text-shadow:5px 5px 0 #000;white-space:nowrap}
.logo span{display:inline-block;animation:bob 1.4s steps(4) infinite}
.logo .sp{width:.5em}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tagline{text-align:center;font-size:13px;color:var(--ye);margin:6px 0}
.trainC{display:block;width:100%;max-width:900px;margin:6px auto;image-rendering:pixelated;height:auto}
.lvcard{background:var(--panel2);border:3px solid #000;padding:12px;box-shadow:4px 4px 0 #000;display:flex;flex-direction:column;gap:6px}
.lvcard .ic{font-size:34px}
.lvcard .mis{font-size:9px;color:var(--mut)}
.stars{font-size:16px;letter-spacing:2px}
.lesson{background:rgba(10,11,30,.7);border-left:5px solid var(--cy);padding:10px 12px;margin:10px 0}
.lesson.pk{border-color:var(--pk)}.lesson.ye{border-color:var(--ye)}.lesson.gr{border-color:var(--gr)}.lesson.or{border-color:var(--or)}.lesson.pu{border-color:var(--pu)}.lesson.rd{border-color:var(--rd)}
.lesson p{margin:4px 0}
.fcrow{display:grid;grid-template-columns:34px 64px 64px 1.2fr 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed #26285a}
@media(max-width:780px){.fcrow{grid-template-columns:34px 60px 64px 1fr}.fcrow .hm{grid-column:2/5}}
.spr{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.sl{margin:10px 0}
.sl label{display:block;margin-bottom:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:#0d0e24;border:3px solid #000;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;background:var(--c,#1b9fe0);border:3px solid #000;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:22px;background:var(--c,#1b9fe0);border:3px solid #000;border-radius:0;cursor:pointer}
.stack{display:flex;height:34px;border:3px solid #000;margin:12px 0;overflow:hidden}
.stack div{color:#fff!important;text-shadow:1px 1px 0 #000;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:9px;color:#0a0b1e;overflow:hidden;white-space:nowrap;transition:width .15s}
.modal{position:fixed;inset:0;background:rgba(5,5,16,.9);z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
.modal>.panel{max-width:780px;width:100%;max-height:90vh;overflow:auto;margin:0}
.wheelWrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.wheelC{width:340px;height:340px;max-width:82vw;max-height:82vw;image-rendering:auto}
.legend div{display:flex;gap:8px;align-items:center;margin:3px 0}
.legend i{width:16px;height:16px;border:2px solid #000;display:inline-block}
.bigday{font-family:'Press Start 2P';font-size:30px;color:var(--ye);text-shadow:3px 3px 0 #000}
.wagon{width:100%;max-width:720px;image-rendering:pixelated;display:block;margin:8px auto}
.ticker{min-height:160px;display:flex;flex-direction:column;gap:4px}
.ticker div{padding:4px 8px;background:rgba(10,11,30,.75);border-left:4px solid var(--cy);animation:pop .25s steps(3)}
@keyframes pop{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.cnt{grid-template-columns:repeat(2,1fr)}}
.cnt>div{background:var(--panel2);border:3px solid #000;padding:6px;text-align:center}
.sbar{display:grid;grid-template-columns:150px 1fr 110px;gap:8px;align-items:center;margin:8px 0}
.sbar .tr{height:26px;background:#0d0e24;border:3px solid #000;position:relative}
.sbar .tr i{position:absolute;left:0;top:0;bottom:0;transition:width 1.2s steps(12)}
@media(max-width:600px){.sbar{grid-template-columns:90px 1fr 90px}}
table{border-collapse:collapse;width:100%;font-size:10px}
td,th{padding:4px 6px;border-bottom:2px dashed #26285a;text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-family:'Press Start 2P';font-size:9px;color:var(--mut)}
.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}

.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:500px){.ladder{grid-template-columns:repeat(2,1fr)}}
.pbtn{background:var(--panel2);border:3px solid #000;box-shadow:3px 3px 0 #000;color:var(--ink);padding:8px;cursor:pointer;text-align:left;font-family:'Press Start 2P';font-size:8px;line-height:1.9}
.pbtn .pp{font-family:'Press Start 2P';font-size:13px;color:var(--ye)}
.pbtn.sel{background:var(--pk);color:#fff}.pbtn.sel .pp{color:#fff}
.pbtn.algo{box-shadow:3px 3px 0 var(--pu)}
.pbtn .mb{height:8px;background:#0d0e24;margin-top:5px;border:1px solid #000}.pbtn .mb i{display:block;height:100%;background:var(--cy)}
.evcard{border:3px solid #000;padding:12px;color:#fff;text-shadow:2px 2px 0 #000;box-shadow:4px 4px 0 #000}
.evcard h3{color:#fff;font-size:12px}
.chart{width:100%;height:auto;image-rendering:pixelated;display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:#000;border:3px solid var(--ye);padding:10px 16px;font-size:11px;max-width:92vw;text-align:center;animation:pop .2s steps(3)}
.rank{font-family:'Press Start 2P';font-size:clamp(18px,4vw,30px);text-align:center;margin:10px 0;text-shadow:3px 3px 0 #000}
textarea{width:100%;height:260px;background:#0d0e24;color:var(--gr);border:3px solid #000;font-family:'Press Start 2P';font-size:10px}
.glo{margin:8px 0;padding:8px;border-left:4px solid var(--cy);background:rgba(10,11,30,.6)}
.glo b{font-family:'Press Start 2P';font-size:10px;color:var(--cy)}
input.search{width:100%;padding:8px;background:#0d0e24;color:var(--ink);border:3px solid #000;font-family:'Press Start 2P';font-size:11px}
.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
footer{text-align:center;color:var(--mut);font-size:9px;margin-top:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65;width:100%;height:100%;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="scan"></div><canvas id="confetti"></canvas>
<div id="app">
  <div class="top">
    <div class="brand px" id="brand">LAST <i>SEAT</i></div>
    <div class="topbtns">
      <button class="btn ghost sm" id="bGlo" title="Glossaire">📖</button>

      <button class="btn ghost sm" id="bMus" title="Musique / Music">🎵</button>
      <button class="btn ghost sm" id="bSnd" title="Bruitages / Sound effects">🔊</button>
    </div>
  </div>
  <main id="scr"></main>
  <footer id="foot"></footer>
</div>
<div id="modal" class="modal hidden"><div class="panel" id="mbox"></div></div>
<script>
'use strict';
/* =========================================================
   LAST SEAT — un jeu pour apprendre le Revenue Management
   Architecture : DONNEES · REGLES (modèles) · RENDU
   ========================================================= */
const $=s=>document.querySelector(s);
const S={lang:'fr',sound:true,log:[],scores:{},busy:false,cur:null};
try{const l=localStorage.getItem('lastseat_lang');if(l==='en'||l==='fr')S.lang=l;const sc=JSON.parse(localStorage.getItem('lastseat_scores')||'{}');if(sc&&typeof sc==='object')S.scores=sc;}catch(e){}
function saveScores(){try{localStorage.setItem('lastseat_scores',JSON.stringify(S.scores));}catch(e){}}
const T=(fr,en)=>S.lang==='fr'?fr:en;
const Lx=o=>typeof o==='string'?o:(S.lang==='fr'?o.fr:o.en);
const eur=n=>Math.round(n).toLocaleString(S.lang==='fr'?'fr-FR':'en-GB')+(S.lang==='fr'?' €':'€');
const pc=x=>Math.round(x*100)+(S.lang==='fr'?' %':'%');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const R=Math.random;
const COLORS=['#1b9fe0','#c8107e','#ffb612','#82be00','#8f86e6','#e05206','#00b388'];
function randn(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function normInv(p){if(p<=0)return -8;if(p>=1)return 8;
 const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
 b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
 c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
 d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];const pl=0.02425;let q,r;
 if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 if(p<=1-pl){q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
 q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
const Phi=x=>0.5*(1+erf(x/Math.SQRT2));
function pickW(arr){const tot=arr.reduce((s,a)=>s+a.w,0);let r=R()*tot;for(let i=0;i<arr.length;i++){r-=arr[i].w;if(r<=0)return i;}return arr.length-1;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickOne=a=>a[Math.floor(R()*a.length)];
function logIt(level,step,action,detail,value){S.log.push({level,step,action,detail,value});}
const starStr=n=>'<span class="ye">'+'★'.repeat(n)+'</span><span class="mut">'+'☆'.repeat(3-n)+'</span>';

/* ---------------- SON 8-BIT (généré en direct) ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function beep(f,d=.08,type='square',v=.05,f2=null,delay=0){if(!S.sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03);}catch(e){}}
const SFX={click:()=>beep(660,.05),tick:()=>beep(1400,.018,'square',.025),coin:()=>{beep(988,.05,'square',.04);beep(1319,.1,'square',.04,null,.05);},
 bad:()=>beep(220,.2,'sawtooth',.045,90),win:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.13,'square',.05,null,i*.1)),
 lose:()=>[392,330,262,196].forEach((f,i)=>beep(f,.16,'square',.045,null,i*.13)),whoosh:()=>beep(200,.35,'triangle',.05,1200),
 ding:()=>{beep(1568,.08,'square',.05);beep(2093,.18,'square',.04,null,.08);}};

/* ---------------- MUSIQUE CHIPTUNE FUNKY (générée en direct, aucun fichier audio) ----------------
   Em7 | A7 | Gmaj7 | F#7 — 108 BPM, doubles-croches swinguées.
   Le morceau évolue toutes les 4 mesures : groove → mélodie → arpèges → tout ensemble. */
const MUS={on:true,playing:false,step:0,next:0,timer:null,gain:null,loop:0};
try{if(localStorage.getItem('lastseat_music')==='0')MUS.on=false;}catch(e){}
const ST=60/108/4,mf=n=>440*Math.pow(2,(n-69)/12);let pulse25=null,noiseBuf=null;
function musInit(){const a=ac();if(!a)return false;if(!MUS.gain){MUS.gain=a.createGain();MUS.gain.gain.value=0;const comp=a.createDynamicsCompressor();MUS.gain.connect(comp);comp.connect(a.destination);
 const re=new Float32Array(32),im=new Float32Array(32);for(let k=1;k<32;k++)re[k]=(2/(k*Math.PI))*Math.sin(k*Math.PI*.25);pulse25=a.createPeriodicWave(re,im);
 noiseBuf=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return true;}
function mTone(t,n,dur,type,vol,wave){const o=AC.createOscillator(),g=AC.createGain();if(wave)o.setPeriodicWave(wave);else o.type=type;o.frequency.setValueAtTime(mf(n),t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+dur+.02);}
function mKick(t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+.16);}
function mNoise(t,dur,vol,hp){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(MUS.gain);s.start(t,Math.random()*.3);s.stop(t+dur+.02);}
function mSnare(t,v=.2){mNoise(t,.13,v,1500);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(120,t+.08);g.gain.setValueAtTime(v*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+.1);}
const MCH=[{r:40,c:[64,67,71,74]},{r:45,c:[64,67,69,73]},{r:43,c:[66,67,71,74]},{r:42,c:[64,66,70,73]}];
const MBASS=[[0,0,2],[3,12,1],[6,0,1],[7,12,1],[9,0,1],[11,10,1],[13,12,1],[14,7,2]];
const MLEAD=[[0,71,2],[3,74,1],[4,76,3],[8,74,1],[10,71,2],[13,69,2],[16,67,2],[19,69,1],[20,73,2],[22,76,2],[26,79,1],[27,76,3],[32,78,2],[35,74,1],[36,71,2],[40,74,1],[42,76,2],[45,74,1],[46,71,2],[48,70,2],[51,73,1],[52,76,2],[56,78,4],[62,76,1],[63,73,1]];
function mStep(i,t){const s=i%16,ch=MCH[Math.floor(i/16)],L=MUS.loop%4;
 if(s===0||s===7||s===10)mKick(t);if(s===4||s===12)mSnare(t);else if(s===15)mSnare(t,.05);
 mNoise(t,s===14?.18:.03,s%2?.022:.045,7000);
 for(const b of MBASS)if(b[0]===s){mTone(t,ch.r+b[1],b[2]*ST*.9,'triangle',.3);mTone(t,ch.r+b[1]+12,b[2]*ST*.45,'square',.045);}
 if(s===2||s===6||s===10||s===13)ch.c.forEach(n=>mTone(t,n,ST*.55,'square',.024));
 if(L===1||L===3)for(const m of MLEAD)if(m[0]===i)mTone(t,m[1],m[2]*ST*.95,null,.065,pulse25);
 if(L>=2){const q=[0,1,2,3,2,1,0,2];mTone(t,ch.c[q[s%8]]+12,ST*.8,'square',.02);}}
function musTick(){if(!MUS.playing||!AC)return;while(MUS.next<AC.currentTime+.15){mStep(MUS.step,MUS.next);MUS.next+=ST*(MUS.step%2?.9:1.1);MUS.step=(MUS.step+1)%64;if(MUS.step===0)MUS.loop++;}}
function musStart(){if(MUS.playing||!MUS.on||document.hidden)return;if(!musInit())return;MUS.playing=true;MUS.step=0;MUS.loop=0;MUS.next=AC.currentTime+.08;
 MUS.gain.gain.cancelScheduledValues(AC.currentTime);MUS.gain.gain.setTargetAtTime(.5,AC.currentTime,.3);MUS.timer=setInterval(musTick,25);musTick();}
function musStop(){MUS.playing=false;clearInterval(MUS.timer);if(MUS.gain&&AC){MUS.gain.gain.cancelScheduledValues(AC.currentTime);MUS.gain.gain.setTargetAtTime(0,AC.currentTime,.05);}}
// Les navigateurs n'autorisent le son qu'après un geste : la musique démarre au premier clic.
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target&&e.target.closest&&e.target.closest('#bMus'))return;if(MUS.on)musStart();}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)musStop();else if(MUS.on&&AC)musStart();});

/* ---------------- FOND ETOILE + SKYLINE ---------------- */
const bg=$('#bg'),bx=bg.getContext('2d');let stars=[],blds=[];
function bgResize(){bg.width=Math.ceil(innerWidth/3);bg.height=Math.ceil(innerHeight/3);
 stars=Array.from({length:Math.floor(bg.width*bg.height/240)},()=>({x:R()*bg.width,y:R()*bg.height*.8,c:pickOne(COLORS),p:R()*6.3,s:R()<.12?2:1,v:.03+R()*.12}));
 blds=[];let x=0;while(x<bg.width){const w=8+Math.floor(R()*16),h=10+Math.floor(R()*40);const win=[];for(let yy=3;yy<h-2;yy+=4)for(let xx=2;xx<w-2;xx+=3)if(R()<.18)win.push([xx,yy,pickOne(COLORS)]);blds.push({x,w,h,win});x+=w+1;}}
addEventListener('resize',bgResize);bgResize();
function bgLoop(ts){bx.fillStyle='#0a0b1e';bx.fillRect(0,0,bg.width,bg.height);
 for(const s of stars){s.x-=s.v;if(s.x<0)s.x+=bg.width;bx.globalAlpha=.3+.7*Math.abs(Math.sin(ts/800+s.p));bx.fillStyle=s.c;bx.fillRect(s.x|0,s.y|0,s.s,s.s);}
 bx.globalAlpha=1;const H=bg.height;for(const b of blds){bx.fillStyle='#13142e';bx.fillRect(b.x,H-b.h,b.w,b.h);for(const w of b.win){bx.fillStyle=w[2];bx.globalAlpha=.55;bx.fillRect(b.x+w[0],H-b.h+w[1],1,1);}bx.globalAlpha=1;}
 requestAnimationFrame(bgLoop);}
requestAnimationFrame(bgLoop);

/* ---------------- CONFETTIS ---------------- */
function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=Math.ceil(innerWidth/4);c.height=Math.ceil(innerHeight/4);
 const ps=Array.from({length:160},()=>({x:R()*c.width,y:-R()*c.height*.5,vx:(R()-.5)*.8,vy:.6+R()*1.4,c:pickOne(COLORS),s:R()<.3?3:2}));let t0=performance.now();
 (function f(ts){x.clearRect(0,0,c.width,c.height);for(const p of ps){p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.s,p.s);}if(ts-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})(t0);}

/* ---------------- SPRITES PIXEL ---------------- */
const SPR=["..HHHH..",".HHHHHH.",".HSSSSH.","..SESE..","..SSSS..",".BBBBBB.","BBBAABBB","BBBAABBB","S.BBBB.S","..BBBB..","..L..L..","..L..L.."];
const PAL={kevin:{H:'#1b9fe0',S:'#f2c39b',B:'#8f86e6',A:'#1b9fe0',L:'#2b2260'},famille:{H:'#6b3b1f',S:'#d9a07a',B:'#ffb612',A:'#e05206',L:'#3b2c80'},
 sophie:{H:'#e05206',S:'#f7d0b0',B:'#82be00',A:'#ffffff',L:'#2b2260'},costard:{H:'#2a2a2a',S:'#f2c39b',B:'#3b3b6b',A:'#c8107e',L:'#1a1a33'},
 nina:{H:'#c8107e',S:'#c68863',B:'#e05206',A:'#ffb612',L:'#2b2260'},senior:{H:'#e6e6e6',S:'#f2c39b',B:'#1b9fe0',A:'#ffffff',L:'#2b2260'},
 influ:{H:'#ffb612',S:'#8d5a3b',B:'#c8107e',A:'#8f86e6',L:'#2b2260'},lea:{H:'#1d1d1d',S:'#e8b48f',B:'#8f86e6',A:'#ffb612',L:'#1a1a33'},
 boss:{H:'#8a8a8a',S:'#f2c39b',B:'#222244',A:'#ffb612',L:'#111'},analyst:{H:'#2b1a10',S:'#8d5a3b',B:'#1b9fe0',A:'#c8107e',L:'#2b2260'}};
const _spr={};
function spr(id){if(_spr[id])return _spr[id];const p=PAL[id];const c=document.createElement('canvas');c.width=8;c.height=12;const x=c.getContext('2d');
 SPR.forEach((row,y)=>[...row].forEach((ch,xx)=>{if(ch==='.')return;x.fillStyle=ch==='E'?'#0a0b1e':p[ch];x.fillRect(xx,y,1,1);}));return _spr[id]=c.toDataURL();}
const sprImg=(id,sz=40)=>`<img class="spr" src="${spr(id)}" style="width:${sz}px;height:${sz*1.5}px" alt="">`;
const WHO={kevin:{fr:'Kevin, étudiant',en:'Kevin, student'},famille:{fr:'La famille Martin',en:'The Martin family'},sophie:{fr:'Sophie, freelance',en:'Sophie, freelancer'},costard:{fr:'M. Costard, consultant',en:'Mr. Suit, consultant'}};

/* ---------------- UI HELPERS ---------------- */
function modal(html,cls=''){$('#mbox').className='panel '+cls;$('#mbox').innerHTML=html;$('#modal').classList.remove('hidden');$('#mbox').scrollTop=0;}
function closeModal(){$('#modal').classList.add('hidden');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!S.busy)closeModal();if(e.target.closest('[data-close]')){SFX.click();closeModal();}});
let toastT=null;
function toast(html,col='#ffb612',ms=1800){let el=$('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.style.borderColor=col;el.innerHTML=html;document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),ms);}
function go(fn){S.cur=fn;fn();window.scrollTo(0,0);renderFoot();}
function renderFoot(){$('#foot').innerHTML=T('LAST SEAT · HYKE © 2026 · Jeu pédagogique inspiré du métier d\'analyste Revenue Management ferroviaire. Projet personnel, non affilié à la SNCF. Modèles simplifiés.','LAST SEAT · HYKE © 2026 · Educational game inspired by the rail Revenue Management analyst job. Personal project, not affiliated with SNCF. Simplified models.');}
function scoreBars(rows){const mx=Math.max(...rows.map(r=>r.v),1);return rows.map(r=>`<div class="sbar"><div>${r.l}</div><div class="tr"><i style="width:0;background:${r.c}" data-w="${Math.max(2,r.v/mx*100)}"></i></div><div class="px" style="font-size:11px;color:${r.c}">${eur(r.v)}</div></div>`).join('');}
function animBars(){setTimeout(()=>document.querySelectorAll('.sbar .tr i').forEach(i=>i.style.width=i.dataset.w+'%'),60);}

/* ---------------- ROUE (composant) ---------------- */
// 12 cases. Un résultat probable occupe plus de cases (ex. 33 % = 4 cases sur 12), réparties autour de la roue.
function buildSlices(segs,n=12){const W=segs.reduce((s,x)=>s+x.w,0);const raw=segs.map((s,i)=>({i,x:s.w/W*n}));const cnt=raw.map(r=>Math.max(1,Math.floor(r.x)));let tot=cnt.reduce((a,b)=>a+b,0);
 const ord=[...raw].sort((a,b)=>(b.x-Math.floor(b.x))-(a.x-Math.floor(a.x)));let k=0;while(tot<n){cnt[ord[k%ord.length].i]++;tot++;k++;}
 while(tot>n){const j=cnt.indexOf(Math.max(...cnt));cnt[j]--;tot--;}
 const out=Array(n).fill(-1);const idx=segs.map((_,i)=>i).sort((a,b)=>cnt[b]-cnt[a]);
 for(const i of idx){const c=cnt[i],step=n/c,st=out.indexOf(-1);for(let j=0;j<c;j++){let q=Math.round(st+j*step)%n;while(out[q]!==-1)q=(q+1)%n;out[q]=i;}}
 return{slices:out,cnt,n};}

 function draw(ts){ctx.clearRect(0,0,S0,S0);
  ctx.save();ctx.shadowColor='rgba(224,82,6,.7)';ctx.shadowBlur=26;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(C,C,Rr+21,0,7);ctx.fill();ctx.restore();

  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,x=C+Math.cos(a)*(Rr+12),y=C+Math.sin(a)*(Rr+12);const on=spinning?((i+Math.floor(ts/70))%2===0):win>=0?Math.floor(ts/220)%2===0:((i+Math.floor(ts/350))%3===0);
   if(on){ctx.fillStyle='rgba(255,182,18,.4)';ctx.fillRect(x-6,y-6,12,12);}ctx.fillStyle=on?'#fff7cf':'#5c2200';ctx.fillRect(x-3,y-3,6,6);}
  ctx.save();ctx.translate(C,C);ctx.rotate(ang);
  for(let k=0;k<n;k++){const sg=segs[slices[k]],a0=k*sa,a1=a0+sa;const g=ctx.createRadialGradient(0,0,24,0,0,Rr);g.addColorStop(0,shade(sg.c,-.45));g.addColorStop(.75,sg.c);g.addColorStop(1,shade(sg.c,.18));

   if(win>=0){if(slices[k]===win){if(Math.floor(ts/220)%2){ctx.fillStyle='rgba(255,255,255,.28)';ctx.fill();}}else{ctx.fillStyle='rgba(5,5,16,.55)';ctx.fill();}}
   ctx.strokeStyle='#0a0b1e';ctx.lineWidth=3;ctx.stroke();
   ctx.save();ctx.rotate(a0+sa/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.font='17px sans-serif';ctx.fillText(sg.e||'',Rr-7,1);
   ctx.font='8px "Press Start 2P", monospace';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#000';const t=Lx(sg.s||sg.l);ctx.strokeText(t,Rr-32,1);ctx.fillStyle='#fff';ctx.fillText(t,Rr-32,1);ctx.restore();}

  const py=2+kick*7;ctx.save();ctx.translate(C,py);ctx.rotate(Math.sin(kick*3)*.18);ctx.fillStyle='#000';for(let r=0;r<10;r++)ctx.fillRect(-13+r,r*3,26-2*r,3);ctx.fillStyle='#fff';for(let r=0;r<9;r++)ctx.fillRect(-11+r,1+r*3,22-2*r,2);ctx.fillStyle='#e05206';ctx.fillRect(-4,4,8,7);ctx.restore();

function simNested(al,D){let rem=C1;const sold=[0,0,0,0];for(let k=3;k>=0;k--){let prot=0;for(let j=0;j<k;j++)prot+=al[j];sold[k]=Math.min(D[k],Math.max(0,rem-prot));rem-=sold[k];}return sold;}

const rev1=s=>s.reduce((a,x,k)=>a+x*CL[k].p,0);
function drawD(m){return CL.map((c,k)=>Math.max(0,Math.round(c.mu*m[k]+c.sd*Math.sqrt(m[k])*randn())));}

 x.fillStyle='#0d0e24';x.fillRect(pad,6,W-pad-8,H-pad-6);x.strokeStyle='#26285a';x.lineWidth=1;x.font='9px "Press Start 2P"';x.fillStyle='#9a9cc4';
 for(let v=0;v<=CAP3;v+=100){const y=6+(H-pad-6)*(1-v/CAP3);x.beginPath();x.moveTo(pad,y);x.lineTo(W-8,y);x.stroke();x.fillText(v,4,y+4);}
 D3.forEach((d,i)=>{const X=pad+(W-pad-8)*(i+1)/8;x.fillText((S.lang==='fr'?'J-':'D-')+d,X-16,H-10);});
 const line=(arr,col,dash)=>{x.strokeStyle=col;x.lineWidth=4;x.setLineDash(dash?[8,6]:[]);x.beginPath();arr.forEach((v,i)=>{const X=pad+(W-pad-8)*i/8,Y=6+(H-pad-6)*(1-v/CAP3);i?x.lineTo(X,Y):x.moveTo(X,Y);});x.stroke();x.setLineDash([]);arr.forEach((v,i)=>{const X=pad+(W-pad-8)*i/8,Y=6+(H-pad-6)*(1-v/CAP3);x.fillStyle=col;x.fillRect(X-4,Y-4,8,8);});};
 if(g.guide&&!g.algoSt){const k=g.st.cap/CAP3;x.fillStyle='rgba(27,159,224,.16)';x.beginPath();g.ref.forEach((v,i)=>{const X=pad+(W-pad-8)*i/8,Y=6+(H-pad-6)*(1-Math.min(CAP3,v*k*1.2)/CAP3);i?x.lineTo(X,Y):x.moveTo(X,Y);});for(let i=8;i>=0;i--){const X=pad+(W-pad-8)*i/8,Y=6+(H-pad-6)*(1-g.ref[i]*k*.8/CAP3);x.lineTo(X,Y);}x.closePath();x.fill();}line(g.ref,'#1b9fe0',true);if(g.algoSt)line(g.algoSt.curve,'#8f86e6',false);line(g.st.curve,'#c8107e',false);
 if(g.st.panne){x.strokeStyle='#f0233a';x.setLineDash([4,4]);const y=6+(H-pad-6)*(1-200/CAP3);x.beginPath();x.moveTo(pad,y);x.lineTo(W-8,y);x.stroke();x.setLineDash([]);}}
function l3End(){const g=G3;const a=newSt();g.evs.forEach((ev,t)=>{applyEv(a,ev);const p=algoPick(g.V,t,a.cap-a.sold,ev);sell3(a,t,p,ev,g.noise[t]);});g.algoSt=a;go(l3Result);}
function l3Result(){try{localStorage.setItem('lastseat_l3done','1');}catch(e){}const g=G3,y=final3(g.st),a=final3(g.algoSt);const stars=y.score>=a.score?3:y.score>=.93*a.score?2:y.score>=.83*a.score?1:0;S.scores[3]=Math.max(S.scores[3]||0,stars);saveScores();
 logIt(3,99,'result',`you_rev=${Math.round(g.st.rev)};you_score=${Math.round(y.score)};algo_rev=${Math.round(g.algoSt.rev)};algo_score=${Math.round(a.score)}`,Math.round(y.score));
 const row=(l,f1,f2)=>`<tr><td>${l}</td><td>${f1}</td><td>${f2}</td></tr>`;const st=g.st,as=g.algoSt;
 const tips=[];if(y.share<.5)tips.push(['rd',T(`<b>Engagement prix non tenu</b> : seulement ${pc(y.share)} de billets sous 47 €. -15 %. Le Revenue Management ne se fait pas contre la politique commerciale.`,`<b>Price pledge broken</b>: only ${pc(y.share)} of tickets under 47€. -15%. Revenue Management doesn't work against commercial policy.`)]);
 if(st.col>=70)tips.push(['rd',T('<b>Bad buzz</b> : la colère a dépassé 70. -10 %. Un prix trop agressif coûte en image, donc en clients futurs.','<b>Bad buzz</b>: anger went over 70. -10%. Overly aggressive pricing costs reputation, and future customers.')]);
 if(st.sold<st.cap*.85)tips.push(['or',T(`<b>Spoilage</b> : ${st.cap-st.sold} places parties vides. Une place vide au départ, c'est 0 € pour toujours.`,`<b>Spoilage</b>: ${st.cap-st.sold} seats left empty. An empty seat at departure is 0€ forever.`)]);
 const fullAt=st.curve.findIndex(v=>v>=st.cap);if(fullAt>0&&fullAt<7)tips.push(['ye',T(`<b>Complet trop tôt</b> (dès ${D3[fullAt-1]} jours du départ) : les pros de la dernière minute, prêts à payer 125 €, n'ont rien trouvé.`,`<b>Full too early</b> (at D-${D3[fullAt-1]}): last-minute business travellers, ready to pay 125€, found nothing.`)]);
 tips.push(['pu',a.m>0?T(`<b>L'algo a pris ${Math.round(a.m*100)} % de malus</b> : il maximise la recette brute mais ignore l'engagement prix et l'image. C'est pour ça qu'il faut un analyste derrière l'outil : les décisions automatiques ont besoin de garde-fous et de jugement.`,`<b>The algorithm took a ${Math.round(a.m*100)}% penalty</b>: it maximises gross revenue but ignores the price pledge and image. That's why there's an analyst behind the tool: automated decisions need guardrails and judgement.`):T('<b>L\'algo a tenu les contraintes cette fois</b>, avec sa programmation dynamique. L\'analyste apporte ce que l\'algo ne voit pas : contexte, événements, politique commerciale.','<b>The algorithm met the constraints this time</b>, using dynamic programming. The analyst brings what the algorithm can\'t see: context, events, commercial policy.')]);
 $('#scr').innerHTML=`<div class="panel n-ye center"><h2>${T('RESULTAT · NIVEAU 3','RESULT · LEVEL 3')}</h2><div class="stars" style="font-size:40px">${starStr(stars)}</div></div>
 <div class="panel n-cy">${scoreBars([{l:'🫵 '+T('Toi','You'),v:y.score,c:'#c8107e'},{l:'🤖 Algo',v:a.score,c:'#8f86e6'}])}
 <table><tr><th></th><th>${T('Toi','You')}</th><th>Algo</th></tr>${row(T('Recette brute','Gross revenue'),eur(st.rev),eur(as.rev))}${row(T('Billets vendus','Tickets sold'),st.tot,as.tot)}${row(T('Remplissage final','Final load'),pc(st.sold/st.cap),pc(as.sold/as.cap))}${row(T('Billets < 47 €','Tickets < 47€'),pc(y.share),pc(a.share))}${row(T('Colère','Anger'),st.col,as.col)}${row('Malus',(y.m?'-':'')+Math.round(y.m*100)+(S.lang==='fr'?' %':'%'),(a.m?'-':'')+Math.round(a.m*100)+(S.lang==='fr'?' %':'%'))}${row('<b>Score</b>','<b>'+eur(y.score)+'</b>','<b>'+eur(a.score)+'</b>')}</table>
 <h3 style="margin-top:12px">${T('TES PRIX','YOUR PRICES')}</h3><p>${g.prices.map((p,i)=>`<span class="tag" style="background:${L3E.find(e=>e.id===g.evs[i]).c}">${(S.lang==='fr'?'J-':'D-')+D3[i]} ${p}€</span>`).join(' ')}</p>
 <canvas class="chart" id="curve" width="640" height="200"></canvas><p class="mut" style="font-size:9px">${T('<span class="pk">■ Toi</span> · <span class="pu">■ Algo</span> · <span class="cy">■ Référence</span>','<span class="pk">■ You</span> · <span class="pu">■ Algorithm</span> · <span class="cy">■ Reference</span>')}</p></div>
 <div class="panel n-pu"><h2>🎓 ${T('Ce que tu viens d\'apprendre','What you just learned')}</h2>${tips.map(t=>`<div class="lesson ${t[0]}"><p>${t[1]}</p></div>`).join('')}</div>
 <div class="row"><button class="btn ghost" id="bk">← Menu</button><button class="btn ghost" id="again">↻ ${T('Rejouer','Replay')}</button><button class="btn pk big" id="nx">🏁 ${T('Bilan final','Final debrief')} ➜</button></div>`;
 drawCurve();animBars();if(stars>=2){SFX.win();confetti();}else SFX.lose();
 $('#bk').onclick=()=>{SFX.click();go(scrTitle);};$('#again').onclick=()=>{SFX.click();go(l3Start);};$('#nx').onclick=()=>{SFX.click();go(scrFinal);};}

   MODALES : GLOSSAIRE · A PROPOS · JOURNAL

const GLO=[['Revenue Management','Optimiser la recette d\'une capacité fixe et périssable en vendant la bonne place au bon client, au bon prix, au bon moment.','Maximising revenue from fixed, perishable capacity by selling the right seat to the right customer at the right price and time.'],
 ['Yield','Recette par voyageur (ou par voyageur-km). Souvent utilisé comme synonyme de Revenue Management.','Revenue per passenger (or passenger-km). Often used as a synonym for Revenue Management.'],
 ['Classe tarifaire / Fare class','Un niveau de prix ouvert à la vente (ex. MINI, ECO, FLEX, PRO). On ouvre et ferme les classes selon la demande.','A price level open for sale (e.g. MINI, ECO, FLEX, PRO). Classes are opened and closed depending on demand.'],
 ['Emboîtement / Nesting','Une place disponible dans une classe basse l\'est aussi pour les classes hautes. Les places protégées pour le haut ne descendent jamais.','A seat available in a low class is also available to higher classes. Seats protected for high fares never go down.'],
 ['Protection / Booking limit','Nombre de places gardées pour les prix hauts (protection) et maximum vendable dans une classe basse (limite de réservation).','Seats kept for high fares (protection level) and the maximum sellable in a low class (booking limit).'],
 ['Règle de Littlewood','Protège une place de plus pour le prix haut tant que P(la vendre au prix haut) × prix haut ≥ prix bas.','Protect one more seat for the high fare as long as P(selling it at the high fare) × high fare ≥ low fare.'],
 ['EMSR-b','Heuristique classique (Belobaba) qui applique Littlewood à plusieurs classes en regroupant les classes du haut.','Classic heuristic (Belobaba) that extends Littlewood to many classes by pooling the upper ones.'],
 ['Spill','Demande perdue : clients refusés parce que la classe est fermée ou le train plein.','Lost demand: customers turned away because the class is closed or the train full.'],
 ['Spoilage','Places parties vides alors qu\'on aurait pu les vendre (souvent : trop protégé).','Seats that left empty but could have been sold (often: over-protection).'],
 ['Taux d\'occupation / Load factor','Places vendues ÷ capacité. Un train plein n\'est pas forcément un train rentable.','Seats sold ÷ capacity. A full train isn\'t necessarily a profitable one.'],
 ['Prévision de demande / Forecast','Estimation de la demande future par classe et par date, à partir de l\'historique et du contexte.','Estimate of future demand per class and date, based on history and context.'],
 ['Demande censurée','Quand une classe est fermée, on ne voit plus la vraie demande : il faut la « déconstraindre » pour bien prévoir.','When a class is closed, true demand is hidden: it must be "unconstrained" to forecast properly.'],
 ['Courbe de montée en charge / Booking curve','Evolution des réservations cumulées de J-x au départ, comparée à des trains de référence.','Cumulative bookings from D-x to departure, compared with reference trains.'],
 ['OD (origine-destination)','Le trajet acheté par le client (ex. Paris → Marseille).','The trip the customer buys (e.g. Paris → Marseille).'],
 ['Tronçon / Leg','Portion de ligne entre deux arrêts consécutifs. Une OD peut utiliser plusieurs tronçons.','Segment between two consecutive stops. An O&D can use several legs.'],
 ['Coût de déplacement / Displacement cost','Recette future qu\'on sacrifie en vendant une place maintenant.','Future revenue sacrificed by selling a seat now.'],
 ['Bid price','Valeur marginale d\'une place sur un tronçon. On accepte une demande si son prix ≥ somme des bid prices des tronçons utilisés.','Marginal value of a seat on a leg. Accept a request if its price ≥ sum of bid prices of the legs used.'],
 ['Consentement à payer / WTP','Prix maximum qu\'un client accepte de payer.','The maximum price a customer will accept.'],
 ['Elasticité-prix','Sensibilité de la demande au prix. Elastique : une hausse de prix fait fuir beaucoup de clients.','How sensitive demand is to price. Elastic: a price rise drives many customers away.'],
 ['Pricing dynamique','Ajustement du prix dans le temps selon la demande, la concurrence et le remplissage.','Adjusting price over time based on demand, competition and load.'],
 ['Veille tarifaire / Fare tracking','Suivi en temps réel des prix des concurrents (train, avion, car, covoiturage).','Real-time monitoring of competitors\' prices (rail, air, coach, carpooling).'],
 ['Cannibalisation','Quand une offre moins chère capte des clients qui auraient payé plus cher.','When a cheaper offer captures customers who would have paid more.'],
 ['Monte-Carlo','Simuler des milliers de scénarios aléatoires pour juger une stratégie sur la durée, pas sur un coup de chance.','Simulating thousands of random scenarios to judge a strategy over time, not on a lucky draw.'],
 ['Programmation dynamique','Méthode qui découpe une décision en étapes et calcule la meilleure valeur future pour chaque état.','Method that splits a decision into stages and computes the best future value for each state.'],
 ['Devin / Hindsight','Optimum calculé a posteriori, en connaissant toute la demande. Inatteignable, mais sert d\'étalon.','Optimum computed after the fact, knowing all demand. Unreachable, but a useful benchmark.'],
 ['REX / Post-mortem','Retour d\'expérience : analyser les résultats d\'une stratégie ou d\'une expérimentation pour corriger la suivante.','Lessons learned: analysing the results of a strategy or experiment to fix the next one.'],
 ['Composition (US / UM)','Unité simple ou unités multiples : un train peut circuler avec une ou deux rames, ce qui change la capacité à vendre.','Single or multiple unit: a train can run with one or two trainsets, which changes sellable capacity.']];
